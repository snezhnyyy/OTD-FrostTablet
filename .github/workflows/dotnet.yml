name: CI

on:
  workflow_dispatch:
  push:
    branches: [ "0.6.x" ]
  pull_request:

jobs:
  test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest ]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build FrostTablet app
        run: dotnet build OpenTabletDriver.UX.Avalonia -c Release
      - name: Test
        # upstream's Linux path tests only pass on Linux
        if: runner.os == 'Linux'
        env:
          CI: "true"
        run: dotnet test OpenTabletDriver.Tests -c Release
